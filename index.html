<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rapid Fire ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#22d3a0;--r:#ff4d5e;--bg:#0f1226;--bg2:#1a1740;--card:#191d3a;--tx:#eef0ff;--mu:#9aa0c9;--ac:#ffb84d;--ac2:#ff8a3d;--bd:#2c3260;--on:#1a1200}
[data-theme="ocean"]{--bg:#06222b;--bg2:#0a3a45;--card:#0c3340;--tx:#e6fbff;--mu:#8bb9c4;--ac:#2ee6c5;--ac2:#27b7e8;--bd:#17505f;--on:#01201c}
[data-theme="sunset"]{--bg:#2a1236;--bg2:#4a1d4f;--card:#3b1b4a;--tx:#fff0e8;--mu:#d1a9c4;--ac:#ff7a59;--ac2:#ffc15e;--bd:#5a2c6b;--on:#2a0d00}
[data-theme="cream"]{--bg:#f4efe3;--bg2:#e9e2cf;--card:#fffaf0;--tx:#23362b;--mu:#6d7d70;--ac:#2f7a53;--ac2:#5aa57a;--bd:#dcd3bc;--on:#fff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%) fixed;color:var(--tx);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:24px;margin:6px 0 2px;text-align:center;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sub{text-align:center;color:var(--mu);font-size:13px;margin-bottom:10px}
.themes{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.themes i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--bd)}
.themes i.on{border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700}
.q{font-size:19px;font-weight:600;margin:6px 0 16px;line-height:1.4}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:13px 15px;margin-bottom:10px;transition:.15s}
.opt:hover{border-color:var(--ac);transform:translateY(-1px);background:rgba(255,255,255,.04)}
.opt b{color:var(--ac)}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:var(--on);border:0;border-radius:14px;padding:13px 18px;font-weight:700;width:100%}
.btn.s{background:transparent;color:var(--mu);border:1px solid var(--bd);margin-top:8px;font-weight:500}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);margin-bottom:10px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.row{display:flex;gap:8px}.row>*{flex:1}
.siren{width:96px;height:96px;margin:6px auto 10px;border-radius:50% 50% 14px 14px}
.siren.g{background:var(--g);animation:fg .5s infinite alternate}.siren.r{background:var(--r);animation:fr .35s infinite alternate}
@keyframes fg{from{box-shadow:0 0 12px var(--g)}to{box-shadow:0 0 50px 14px var(--g)}}
@keyframes fr{from{box-shadow:0 0 12px var(--r);transform:scale(1)}to{box-shadow:0 0 56px 16px var(--r);transform:scale(1.05)}}
.res{text-align:center;font-size:20px;font-weight:700}.res.g{color:var(--g)}.res.r{color:var(--r)}
.ans{font-size:14px;margin:6px 0;padding:9px 12px;border-radius:12px;background:rgba(127,127,127,.12)}.ans b{color:var(--ac)}
.wait{text-align:center;color:var(--mu);padding:14px}
.rv{border-left:4px solid var(--bd);padding:9px 12px;margin:8px 0;font-size:13px;background:rgba(127,127,127,.1);border-radius:10px}.rv.g{border-color:var(--g)}.rv.r{border-color:var(--r)}
.big{font-size:46px;font-weight:800;text-align:center;color:var(--ac)}
.tag{display:inline-block;font-size:12px;color:var(--mu);margin-bottom:6px}
.code{font-size:34px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--ac);margin:8px 0}
.st{text-align:center;font-size:12px;color:var(--mu);margin-top:6px}
</style></head><body><div class="w"><h1>❤️ Rapid Fire</h1><div class="sub" id="sub">Two players · live · same time</div><div class="themes" id="th"></div><div id="app"></div></div>
<script>
const Q=[
["Round 1 · Rapid Fire","Who fell first?",["{1}","{2}","Both at the same time","Still debating 😂"]],
["Round 1 · Rapid Fire","Who is more likely to say “I miss you” first?",["{1}","{2}","Both","Whoever is more emotional that day"]],
["Round 1 · Rapid Fire","Our biggest LDR problem?",["Time difference","Missing each other","Busy schedules","All of the above"]],
["Round 1 · Rapid Fire","If {1} suddenly appeared in Austria, what would {2} do first?",["Hug","Cry","Kiss","All three ❤️"]],
["Round 1 · Rapid Fire","Who gets jealous more easily?",["{1}","{2}","Both","Neither"]],
["Round 1 · Rapid Fire","Who apologizes first after a fight?",["{1}","{2}","Whoever realizes they're wrong","We both stay silent 😂"]],
["Round 1 · Rapid Fire","What's more important in our relationship?",["Communication","Trust","Love","All three"]],
["Round 1 · Rapid Fire","If we had one full day together right now, what would we do?",["Stay in bed and talk","Go on a date","Explore somewhere","Literally just enjoy being together"]],
["Round 1 · Rapid Fire","Who would survive longer without texting the other?",["{1}","{2}","Neither 😂","Whoever loses their phone"]],
["Round 1 · Rapid Fire","What does {2} miss most about {1}?",["Voice","Face","Hugs","Everything"]],
["😏 Slightly Dangerous Round","Who is more stubborn?",["{1}","{2}","Both","Definitely {2} 😌"]],
["😏 Slightly Dangerous Round","Who is more romantic?",["{1}","{2}","Depends on the day","Secret answer"]],
["😏 Slightly Dangerous Round","Who would say “I love you” first after an argument?",["{1}","{2}","Neither","We'd forget why we were fighting 😂"]],
["😏 Slightly Dangerous Round","If {1} stopped texting for 6 hours, what would {2} think?",["He's busy","Something happened","He's ignoring me 😒","Call immediately"]],
["😏 Slightly Dangerous Round","If we could teleport anywhere together, where would we choose?",["Austria","Kerala","Somewhere neither of us has been","Anywhere, as long as we're together ❤️"]],
["🥹 Deep Round","What makes our relationship strong despite the distance?",["Trust","Understanding","Effort","Everything we've built together"]],
["🥹 Deep Round","What does {1} need most from {2}?",["Love","Reassurance","Time","Understanding"]],
["🥹 Deep Round","One thing we never want to change about us?",["Our communication","Our craziness","Our closeness","Everything about us ❤️"]],
["🥹 Deep Round","When we finally live in the same place, what's the first thing we want?",["A proper date","A long hug","A trip together","Just waking up beside each other"]],
["🥹 Deep Round","First message date?",["20.10.2025","10.05.2025","08.04.25","04.05.25"]],
["💌 Memory Round","When did {1} first say “I love you”?",["JAN 25","FEB 4","JAN 23","FEB 14"]],
["💌 Memory Round","When did we first message each other?",["22 SEP","AUG 23","SEP 23","AUG 20"]],
["💌 Memory Round","When did {2} realize she really liked {1}?",["From our very first chat","After a few weeks of talking","The first time we spoke on a call","I don't know, it just happened ❤️"]]
];
const app=document.getElementById('app');
let peer=null,conn=null,me=0,myName='',names={1:'Player 1',2:'Player 2'},mine={},theirs={},v=0,shown=-1,sound=true,stage='setup',code='',status='',err='';
const other=()=>me==1?2:1;
const opt=(i,k,viewer)=>Q[i][2][k].replace(/\{(\d)\}/g,(_,n)=>names[n]+(n==viewer?' (me)':''));
const qtext=i=>Q[i][1].replace(/\{(\d)\}/g,(_,n)=>names[n]);
const link=()=>location.href.split('?')[0]+'?room='+code;
function send(o){try{conn&&conn.open&&conn.send(o)}catch(e){}}
function sync(){send({t:'state',name:myName,ans:mine})}
function mkWav(seq,type){const sr=22050;let n=0;seq.forEach(x=>n+=Math.floor(sr*x[1]));const b=new ArrayBuffer(44+n*2),d=new DataView(b);const w=(o,t)=>{for(let i=0;i<t.length;i++)d.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
 let p=44,ph=0;seq.forEach(([f,t])=>{const m=Math.floor(sr*t);for(let i=0;i<m;i++){ph+=2*Math.PI*f/sr;let y=type==='sq'?(Math.sin(ph)>0?1:-1)*.6:Math.sin(ph);const env=Math.min(1,i/200,(m-i)/400);d.setInt16(p,y*env*0.5*32767,true);p+=2}});
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const A={g:new Audio(mkWav([[523,.15],[659,.15],[784,.15],[1046,.3]],'sin')),r:new Audio(mkWav([[900,.2],[600,.2],[900,.2],[600,.2],[900,.2]],'sq'))};
A.g.preload=A.r.preload='auto';
let unlocked=false;
function unlock(){if(unlocked)return;unlocked=true;Object.values(A).forEach(a=>{a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false;unlocked=false})})}
['pointerdown','touchstart','click','keydown'].forEach(e=>document.addEventListener(e,unlock,{passive:true}));
function beep(ok){try{navigator.vibrate&&navigator.vibrate(ok?[120]:[200,100,200,100,200])}catch(e){}
 if(!sound)return;const a=ok?A.g:A.r;try{a.currentTime=0;a.muted=false;a.volume=1;a.play().catch(()=>{})}catch(e){}}
function setConn(c){
 conn=c;
 c.on('open',()=>{status='connected';stage='play';sync();render()});
 c.on('data',d=>{
  if(d.t==='state'){theirs=d.ans||{};names[other()]=d.name||names[other()];if(stage!=='play')stage='play';render()}
  if(d.t==='restart'){mine={};theirs={};v=0;shown=-1;sync();render()}});
 c.on('close',()=>{status='disconnected';render()});
 c.on('error',()=>{status='disconnected';render()});
}
function host(){
 myName=document.getElementById('nm').value.trim()||'Player 1';me=1;names[1]=myName;
 code=Math.random().toString(36).slice(2,7).toUpperCase().replace(/[IO01]/g,'X');
 peer=new Peer('rapidfire-'+code);
 peer.on('open',()=>{stage='lobby';render()});
 peer.on('connection',c=>setConn(c));
 peer.on('error',e=>{err=e.type==='unavailable-id'?'Code clash, try again.':'Connection problem: '+e.type;stage='setup';render()});
}
function join(c0){
 const nm=document.getElementById('nm');myName=(nm&&nm.value.trim())||'Player 2';me=2;names[2]=myName;
 code=(c0||document.getElementById('cd').value).trim().toUpperCase();if(!code){err='Enter the room code.';render();return}
 stage='joining';render();
 peer=new Peer();
 peer.on('open',()=>setConn(peer.connect('rapidfire-'+code,{reliable:true})));
 peer.on('error',e=>{err=e.type==='peer-unavailable'?'Room not found. Check the code and make sure Player 1 has the page open.':'Connection problem: '+e.type;stage='setup';render()});
}
function render(){
 const sub=document.getElementById('sub');
 if(stage==='setup'){
  const urlRoom=new URLSearchParams(location.search).get('room');
  app.innerHTML=`<div class="card"><div class="sec">Play together</div><p style="color:var(--mu);font-size:14px">One of you creates a game and sends the code or link. The other joins. Both keep the page open.</p>
  ${err?`<div class="ans" style="color:var(--r)">${err}</div>`:''}
  <input id="nm" placeholder="Your name">
  ${urlRoom?`<button class="btn" id="j">Join room ${urlRoom.toUpperCase()}</button>`:`<button class="btn" id="h">Create a game (Player 1)</button>
  <div class="st" style="margin:12px 0">— or join your partner —</div><input id="cd" placeholder="Room code" style="text-transform:uppercase"><button class="btn s" id="j">Join game (Player 2)</button>`}</div>`;
  document.getElementById('j').onclick=()=>join(urlRoom);const h=document.getElementById('h');if(h)h.onclick=host;return}
 if(stage==='lobby'){
  app.innerHTML=`<div class="card"><div class="sec">Room ready</div><div class="code">${code}</div><div class="wait">⏳ Waiting for your partner to join…</div>
  <button class="btn" id="cp">Copy invite link</button><div class="st">Send her the link, or the code above.</div></div>`;
  document.getElementById('cp').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Rapid Fire ❤️',text:'Join my game!',url:link()});else{await navigator.clipboard.writeText(link());alert('Link copied!')}}catch(e){prompt('Copy this link:',link())}};return}
 if(stage==='joining'){app.innerHTML='<div class="card wait">Connecting…</div>';return}
 sub.textContent=`${names[1]} ❤️ ${names[2]}`;
 const dc=status==='disconnected'?'<div class="ans" style="color:var(--r);text-align:center">⚠️ Partner disconnected. Ask them to reopen the link.</div>':'';
 if(v>=Q.length){summary();return}
 const iA=mine[v]!==undefined,tA=theirs[v]!==undefined;
 let h=dc+`<div class="bar"><i style="width:${Math.round(v/Q.length*100)}%"></i></div><div class="card"><div class="sec">${Q[v][0]}</div><div class="tag">Question ${v+1} of ${Q.length}</div><div class="q">${qtext(v)}</div>`;
 if(!iA){Q[v][2].forEach((_,k)=>h+=`<button class="opt" data-k="${k}"><b>${'ABCD'[k]})</b> ${opt(v,k,me)}</button>`);h+='</div>'}
 else if(!tA){h+=`<div class="ans">Your answer: <b>${'ABCD'[mine[v]]}) ${opt(v,mine[v],me)}</b></div><div class="wait">⏳ Waiting for ${names[other()]} to answer…</div></div>`}
 else{const ok=mine[v]===theirs[v];
  h+=`<div class="siren ${ok?'g':'r'}"></div><div class="res ${ok?'g':'r'}">${ok?'💚 Same answer! Match!':'🚨 Different answers!'}</div>
  <div class="ans">${names[me]} (you): <b>${'ABCD'[mine[v]]}) ${opt(v,mine[v],me)}</b></div>
  <div class="ans">${names[other()]}: <b>${'ABCD'[theirs[v]]}) ${opt(v,theirs[v],other())}</b></div>
  <button class="btn" id="nx" style="margin-top:10px">${v==Q.length-1?'See final overview 🎉':'Next question →'}</button></div>`;
  if(shown!==v){shown=v;beep(ok)}}
 app.innerHTML=h+rst();bind()}
function rst(){return `<div class="row"><button class="btn s" id="snd">${sound?'🔊 Sound on':'🔇 Sound off'}</button><button class="btn s" id="t1">▶ Test 💚</button><button class="btn s" id="t2">▶ Test 🚨</button></div><button class="btn s" id="rs">↺ Restart game (both players)</button>`}
function bind(){
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{mine[v]=+b.dataset.k;sync();render()});
 const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{v++;render()};
 document.getElementById('snd').onclick=()=>{sound=!sound;render()};document.getElementById('t1').onclick=()=>{const o=sound;sound=true;beep(true);sound=o};document.getElementById('t2').onclick=()=>{const o=sound;sound=true;beep(false);sound=o};
 document.getElementById('rs').onclick=()=>{if(!confirm('Restart for both of you?'))return;mine={};theirs={};v=0;shown=-1;send({t:'restart'});render()}}
function summary(){
 let m=0,both=0,rows='';
 Q.forEach((q,i)=>{if(mine[i]===undefined||theirs[i]===undefined)return;both++;const ok=mine[i]===theirs[i];if(ok)m++;
  rows+=`<div class="rv ${ok?'g':'r'}"><b>${i+1}. ${qtext(i)}</b><br>${names[me]}: ${opt(i,mine[i],me)}<br>${names[other()]}: ${opt(i,theirs[i],other())}<br>${ok?'💚 Match':'🚨 Different'}</div>`});
 const p=both?Math.round(m/both*100):0;
 const msg=p>=80?'Soulmate sync! 💞':p>=60?'Beautifully in tune ❤️':p>=40?'Lots to talk about tonight 😄':'Opposites attract! Time for a long call 📞';
 const wait=both<Q.length?`<div class="wait">⏳ Waiting for ${names[other()]} to finish (${both}/${Q.length} compared)…</div>`:'';
 app.innerHTML=`<div class="card"><div class="sec">Final Overview</div><div class="big">${m} / ${both}</div><div class="res g">${p}% matched</div><div style="text-align:center;margin:6px 0 10px">${msg}</div>${wait}
 <div class="row"><div class="ans" style="text-align:center">💚 Matches<br><b>${m}</b></div><div class="ans" style="text-align:center">🚨 Different<br><b>${both-m}</b></div></div>${rows}</div>${rst()}`;bind()}

const TH=[['midnight','#ffb84d'],['ocean','#2ee6c5'],['sunset','#ff7a59'],['cream','#2f7a53']];
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rf_theme',t)}catch(e){}
 document.getElementById('th').innerHTML=TH.map(([n,c])=>`<i title="${n}" data-t="${n}" class="${n===t?'on':''}" style="background:${c}"></i>`).join('');
 document.querySelectorAll('#th i').forEach(i=>i.onclick=()=>setTheme(i.dataset.t))}
let t0='midnight';try{t0=localStorage.getItem('rf_theme')||t0}catch(e){}
setTheme(t0);
render();
</script></body></html>
